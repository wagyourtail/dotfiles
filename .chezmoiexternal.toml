# Managed third-party checkouts (replaces git submodules).

[".themes/Sweet"]
    type = "archive"
    url = "https://github.com/EliverLara/Sweet/archive/HEAD.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

