# Per-role machine data. Templates read it via {{ index .machines .role }}.
# Add keys to a role section, then reference them from templates.
# Host-specific one-offs belong in packages/host-<hostname>.txt instead.

# hostname → role map. .chezmoi.toml.tmpl uses this to resolve the role
# without prompting; unknown hostnames get asked at `chezmoi init`.
[hosts]
warch-desktop = "desktop"
# warch-laptop = "laptop"     # uncomment when the laptop is adopted
# my-server = "server"

[machines.desktop]
primary_display = "DP-3"
battery = false
gpu = "amd"
# hyprland.lua monitor entries. `output` is a lua identifier resolved against
# primary_display / [machines.<role>.vars] — "" is the catch-all default.
[[machines.desktop.monitors]]
output = ""
mode = "preferred"
position = "auto"
scale = "auto"

[[machines.desktop.monitors]]
output = "primary_display"
mode = "2560x1440@165"
position = "1920x720"
scale = "1"
vrr = 1

[[machines.desktop.monitors]]
output = "bottom_right_display"
mode = "1920x1080@60"
position = "4480x1080"
scale = "1"

[[machines.desktop.monitors]]
output = "bottom_left_display"
mode = "1920x1080@60"
position = "0x1080"
scale = "1"

[[machines.desktop.monitors]]
output = "top_right_display"
mode = "1920x1080@60"
position = "4480x0"
scale = "1"

[[machines.desktop.monitors]]
output = "top_left_display"
mode = "1920x1080@60"
position = "0x0"
scale = "1"

# Lua locals emitted before the monitor calls. Referenced by window rules
# below — laptop maps them all to its single panel.
[machines.desktop.vars]
top_left_display = "HDMI-A-2"
top_right_display = "DP-4"
bottom_left_display = "HDMI-A-1"
bottom_right_display = "DP-1"

[machines.laptop]
primary_display = "eDP-2"
battery = true
gpu = ""   # intel|amd — set after checking lspci; used by ucode/vulkan notes
[[machines.laptop.monitors]]
output = ""
mode = "preferred"
position = "auto"
scale = "auto"

[[machines.laptop.monitors]]
output = "primary_display"
mode = "2560x1600@165"
position = "0x0"
scale = "1"
vrr = 1

[machines.laptop.vars]
top_left_display = "eDP-2"
top_right_display = "eDP-2"
bottom_left_display = "eDP-2"
bottom_right_display = "eDP-2"

[machines.server]
primary_display = ""
battery = false
gpu = ""
monitors = []
[machines.server.vars]
