#
# /etc/pacman.conf — managed by dotfiles (system/etc/pacman.conf)
#
# Deployed via run_onchange_after_50-system.sh. When a pacman update ships a
# .pacnew for this file, merge upstream changes HERE, not in /etc.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# mirrorlist is regenerated by reflector.timer — pacman must not touch it
# (prevents /etc/pacman.d/mirrorlist.pacnew on every mirrorlist pkg update)
NoUpgrade = etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
